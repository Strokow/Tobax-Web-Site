        <h1>Tobax — Neurofunk Drum &amp; Bass Producer &amp; DJ</h1>
        <p>
          Tobax (real name Aleksei Strokov; German: Alexej Strokow; Russian: Алексей Строков) is a
          drum &amp; bass producer and DJ specializing in neurofunk. Originally from Samara, Russia, he
          has been based in Dresden, Germany since 2021. His discography spans over a hundred tracks with
          releases on labels including Titan, Eatbrain, Neuropunk and C4C Recordings, and he has performed
          at festivals such as Let It Roll, Rampage, Neuropunk and Pirate Station. He placed at the
          Drum &amp; Bass Germany Awards in 2022 (2nd, Best Producer — East Germany) and 2023 (3rd, Best
          Producer; 3rd, Best Track).
        </p>
