# nginx site config for tobax.online (static Vite SPA on Hetzner)
# Place at: /etc/nginx/sites-available/tobax.online  ->  symlink into sites-enabled
# Then: sudo nginx -t && sudo systemctl reload nginx
# TLS: run `sudo certbot --nginx -d tobax.online -d www.tobax.online` (it edits the 443 block + redirect for you).

# --- HTTP: redirect everything to HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name tobax.online www.tobax.online;
    return 301 https://$host$request_uri;
}

# --- HTTPS: serve the built site ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tobax.online www.tobax.online;

    # certbot fills in ssl_certificate / ssl_certificate_key here
    # ssl_certificate     /etc/letsencrypt/live/tobax.online/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/tobax.online/privkey.pem;

    root /var/www/tobax/dist;
    index index.html;

    # gzip (brotli even better if the module is available)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Content-Security-Policy — enable once ready. The Spotify click-to-load player
    # (loaded only after user consent) needs open.spotify.com allowed in frame-src.
    # add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://i.scdn.co https://*.scdn.co; media-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; connect-src 'self' https://ipwho.is; frame-src https://open.spotify.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # Hashed build assets -> cache hard
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: /impressum, /datenschutzerklaerung, deep links & refresh all serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Don't cache the HTML entry (so new deploys are picked up immediately)
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
